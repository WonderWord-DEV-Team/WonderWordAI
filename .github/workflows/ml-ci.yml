name: ML Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ml:
              - 'apps/ml-service/**'
              - '.github/workflows/ml-ci.yml'

  test:
    name: Lint and Pytest
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
      - name: Install dependencies
        working-directory: apps/ml-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run deterministic pytest suite
        working-directory: apps/ml-service
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SENTENCE_TRANSFORMERS_HOME: /tmp/sentence-transformers-cache
        run: python -m pytest tests

  test-skip:
    name: Lint and Pytest
    needs: changes
    if: needs.changes.outputs.ml != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No ML service changes — skipping."
