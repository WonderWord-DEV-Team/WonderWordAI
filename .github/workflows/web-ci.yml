name: Web Frontend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/web-ci.yml'

  build:
    name: Typecheck and Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run safe Vitest tests
        working-directory: apps/web
        run: npm run test
      - name: Run auth tests
        working-directory: apps/web
        run: npm run test:auth
      - name: Run karaoke tests
        working-directory: apps/web
        run: npm run test:karaoke
      - name: Run narration tests
        working-directory: apps/web
        run: npm run test:narration
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Production build
        working-directory: apps/web
        run: npm run build

  build-skip:
    name: Typecheck and Build
    needs: changes
    if: needs.changes.outputs.web != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No web changes — skipping."
