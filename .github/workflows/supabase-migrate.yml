name: Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

jobs:
  migrate-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations to staging
        run: supabase db push --db-url "${{ secrets.SUPABASE_STAGING_DB_URL }}" --yes

  migrate-dev:
    runs-on: ubuntu-latest
    needs: migrate-staging
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations to dev
        run: supabase db push --db-url "${{ secrets.SUPABASE_DEV_DB_URL }}" --yes